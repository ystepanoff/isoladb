name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        experimental: [false]
        # Python 3.15 is pre-release until ~October 2026: test it, but
        # don't let it block the build (wheels for deps may also lag).
        include:
          - os: ubuntu-latest
            python-version: "3.15"
            experimental: true
          - os: macos-latest
            python-version: "3.15"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental }}

      - name: Cache isoladb PG binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/isoladb
          key: isoladb-pg-${{ runner.os }}-${{ runner.arch }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install poetry-core
          pip install -e ".[pytest,psycopg,sqlalchemy]"
          pip install pytest ruff mypy

      - name: Lint with ruff
        run: ruff check src/ tests/

      # Only on the newest stable Python: older runners resolve an older mypy
      # with different behavior, and modern mypy cannot target Python 3.8 anyway.
      - name: Type check with mypy
        if: matrix.python-version == '3.14'
        run: mypy src/isoladb/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -v
